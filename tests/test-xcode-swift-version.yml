name: Test xcode and swift version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          xcode: '14'
          swift: '5'
          action: none
        continue-on-error: true
      - name: Assert action was invoked with xcode and swift inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with xcode and swift inputs"
