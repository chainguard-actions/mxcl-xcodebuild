name: Test platform=macOS with action=none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with platform=macOS and action=none
        id: action
        uses: .
        with:
          action: none
          platform: macOS
      - name: Assert action completed without error
        run: |
          echo "PASS: action completed with platform=macOS and action=none"
