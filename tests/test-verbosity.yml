name: Test verbosity input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          action: none
          verbosity: quiet
      - name: Assert action completed with verbosity quiet
        run: |
          echo "Action completed successfully with verbosity: quiet"
          echo "PASS"
