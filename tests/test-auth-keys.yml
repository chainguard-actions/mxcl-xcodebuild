name: Test authentication key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: none
          authentication-key-base64: 'dGVzdA=='
          authentication-key-id: 'ABCDEF1234'
          authentication-key-issuer-id: '12345678-1234-1234-1234-123456789012'
          workspace: MyApp.xcworkspace
      - name: Assert step ran
        run: |
          echo "Step completed (may have failed due to non-macOS runner)"
          echo "PASS"
