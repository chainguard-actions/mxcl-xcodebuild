name: Test swift and xcode version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          action: none
          xcode: '^15'
          swift: '^5'
          workspace: MyApp.xcworkspace
          sanitizer: thread
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (may fail on non-macOS runner, which is expected)"
          echo "PASS"
