name: Test arch and scheme inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          arch: x86_64
          scheme: MyScheme
          action: none
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (may fail on non-macOS runner)"
          echo "PASS: inputs arch and scheme were accepted"
