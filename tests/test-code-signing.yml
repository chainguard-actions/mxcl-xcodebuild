name: Test code signing inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          authentication-key-base64: dGVzdC1rZXk=
          authentication-key-id: ABCDEF1234
          authentication-key-issuer-id: 12345678-1234-1234-1234-123456789012
          code-sign-certificate: dGVzdC1jZXJ0
          code-sign-certificate-passphrase: test-passphrase
          code-sign-identity: Apple Distribution
          action: none
      - name: Assert action ran (succeeds or fails gracefully on non-macOS)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
