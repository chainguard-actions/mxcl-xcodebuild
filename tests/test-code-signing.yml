name: Test code signing inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          action: none
          code-sign-certificate: 'dGVzdC1jZXJ0aWZpY2F0ZQ=='
          code-sign-certificate-passphrase: 'test-passphrase'
          code-sign-identity: 'Apple Development: Test User'
          mobile-provisioning-profiles-base64: 'dGVzdC1tb2JpbGUtcHJvZmlsZQ=='
          provisioning-profiles-base64: 'dGVzdC1tYWMtcHJvZmlsZQ=='
      - name: Assert action completed
        run: |
          echo "PASS: action ran with code-signing inputs"
