name: Test code signing inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          code-sign-certificate: dGVzdC1jZXJ0aWZpY2F0ZQ==
          code-sign-certificate-passphrase: test-passphrase
          code-sign-identity: Apple Development
          action: none
        continue-on-error: true
      - name: Assert action was invoked with code signing inputs
        run: |
          echo "Action step completed (continue-on-error allows non-macOS runners)"
          echo "PASS: code signing inputs were accepted"
