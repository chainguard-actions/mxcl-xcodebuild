name: Test working-directory input with action none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory to use as working directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myproject"
          echo "Created myproject directory"
      - id: action
        uses: .
        with:
          action: none
          working-directory: myproject
      - name: Assert xcodebuild is available after working-directory set
        run: |
          echo "Checking xcodebuild is available"
          if ! command -v xcodebuild &>/dev/null; then
            echo "FAIL: xcodebuild not found on PATH"
            exit 1
          fi
          echo "PASS: xcodebuild is available with working-directory=myproject"
          xcodebuild -version
