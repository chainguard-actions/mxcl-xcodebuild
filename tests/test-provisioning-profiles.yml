name: Test provisioning profiles inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mobile-provisioning-profiles-base64: "dGVzdC1tb2JpbGUtcHJvZmlsZQ=="
          provisioning-profiles-base64: "dGVzdC1tYWMtcHJvZmlsZQ=="
          action: build
      - name: Assert action ran (provisioning profile inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with provisioning profile inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
