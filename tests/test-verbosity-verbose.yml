name: Test verbosity verbose with action none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          action: none
          verbosity: verbose
      - name: Assert xcodebuild is available after verbose verbosity
        run: |
          echo "Checking xcodebuild is available"
          if ! command -v xcodebuild &>/dev/null; then
            echo "FAIL: xcodebuild not found on PATH"
            exit 1
          fi
          echo "PASS: xcodebuild is available with verbosity=verbose"
          xcodebuild -version
