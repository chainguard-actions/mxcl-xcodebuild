name: Test verbosity=quiet with action=none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with verbosity=quiet and action=none
        id: action
        uses: .
        with:
          action: none
          verbosity: quiet

      - name: Assert xcode-select is functional after action
        run: |
          XCODE_PATH="$(xcode-select --print-path 2>&1)"
          echo "xcode-select path: $XCODE_PATH"
          if [ -z "$XCODE_PATH" ]; then
            echo "FAIL: xcode-select returned empty path"
            exit 1
          fi
          echo "PASS: xcode-select path is $XCODE_PATH"
