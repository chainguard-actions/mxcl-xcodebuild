name: Test verbosity quiet mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with quiet verbosity and action=none
        id: action
        uses: .
        with:
          action: none
          verbosity: quiet
      - name: Assert xcodebuild is still accessible after quiet mode selection
        run: |
          xcodebuild -version
          echo "PASS: xcodebuild accessible after quiet verbosity selection"
