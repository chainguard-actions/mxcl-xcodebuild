name: Test code-sign inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          code-sign-certificate: dGVzdA==
          code-sign-certificate-passphrase: test-passphrase
          code-sign-identity: Apple Development
          action: none
      - name: Assert action completed
        run: |
          echo "PASS: action completed with code-sign inputs"
