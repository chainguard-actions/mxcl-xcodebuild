name: Test working-directory and workspace inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          working-directory: .
          workspace: MyApp.xcworkspace
          action: none
      - name: Assert action completed
        run: |
          echo "PASS: action completed with working-directory and workspace inputs"
