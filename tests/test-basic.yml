name: Test basic usage with common inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          xcode: '14'
          swift: '5'
          platform: macOS
          platform-version: '13'
          arch: arm64
          action: none
          scheme: MyScheme
          configuration: Debug
          working-directory: '.'
          verbosity: quiet
          upload-logs: on-failure
          trust-plugins: 'false'
          warnings-as-errors: 'false'
          code-coverage: 'false'
      - name: Assert action ran (may fail on non-macOS, that is expected)
        run: |
          echo "Action completed (continue-on-error allows non-macOS failure)"
          echo "PASS"
