name: Test basic usage with xcode/swift/platform inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          xcode: '14'
          swift: '5'
          platform: macOS
          platform-version: '13'
          arch: x86_64
          scheme: MyScheme
          configuration: Debug
          working-directory: '.'
          action: none
          verbosity: quiet
          upload-logs: on-failure
          trust-plugins: 'false'
          warnings-as-errors: 'false'
          code-coverage: 'false'
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action step completed (action=none skips xcodebuild)"
          echo "PASS"
