name: Test platform, platform-version, and arch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          platform: macOS
          platform-version: '13'
          arch: arm64
          action: none
        continue-on-error: true
      - name: Assert action was invoked with platform, platform-version, and arch inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with platform, platform-version, and arch inputs"
