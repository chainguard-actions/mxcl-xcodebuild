name: Test authentication and workspace inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          workspace: MyApp.xcworkspace
          authentication-key-base64: 'dGVzdC1rZXk='
          authentication-key-id: 'ABCDEF1234'
          authentication-key-issuer-id: '12345678-1234-1234-1234-123456789012'
          action: build
          verbosity: quiet
          upload-logs: on-failure
      - name: Assert action ran (may fail on non-macOS runner)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step completed (continue-on-error allows non-macOS failure)"
