name: Test authentication key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          action: none
          authentication-key-base64: 'dGVzdC1rZXktYmFzZTY0'
          authentication-key-id: 'TESTKEY123'
          authentication-key-issuer-id: '12345678-1234-1234-1234-123456789012'
      - name: Assert action completed
        run: |
          echo "PASS: action ran with authentication-key inputs"
