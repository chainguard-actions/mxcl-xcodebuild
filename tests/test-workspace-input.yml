name: Test workspace input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workspace: MyApp.xcworkspace
          action: none
        continue-on-error: true
      - name: Assert action was invoked with workspace input
        run: |
          echo "Action step completed (continue-on-error allows non-macOS runners)"
          echo "PASS: workspace input was accepted"
