name: Test Xcode version selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select Xcode with semver range and skip build
        id: action
        uses: .
        with:
          xcode: ^15
          action: none
      - name: Assert selected Xcode version is 15.x
        run: |
          XCODE_VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "Selected Xcode version: $XCODE_VER"
          MAJOR=$(echo "$XCODE_VER" | cut -d. -f1)
          if [ "$MAJOR" -lt 15 ]; then
            echo "FAIL: Expected Xcode 15+, got $XCODE_VER"
            exit 1
          fi
          echo "PASS: Xcode $XCODE_VER satisfies ^15"
