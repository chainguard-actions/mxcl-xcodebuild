name: Test App Store Connect authentication key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          authentication-key-base64: dGVzdC1hdXRoLWtleQ==
          authentication-key-id: ABCDE12345
          authentication-key-issuer-id: 12345678-1234-1234-1234-123456789012
          action: none
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (may fail on non-macOS runner)"
          echo "PASS: authentication key inputs were accepted"
