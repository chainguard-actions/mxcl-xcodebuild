name: Test authentication key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          authentication-key-base64: dGVzdC1hdXRoLWtleQ==
          authentication-key-id: ABCDEF1234
          authentication-key-issuer-id: 12345678-1234-1234-1234-123456789012
          action: none
        continue-on-error: true
      - name: Assert action was invoked with authentication key inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with authentication key inputs"
