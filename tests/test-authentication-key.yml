name: Test authentication-key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          authentication-key-base64: dGVzdA==
          authentication-key-id: ABCDEF1234
          authentication-key-issuer-id: 12345678-1234-1234-1234-123456789012
          action: none
      - name: Assert action completed
        run: |
          echo "PASS: action completed with authentication-key inputs"
